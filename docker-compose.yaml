services:
  app:
    build: .
    image: demo-app:1.0
    container_name: demo
    expose:
      - 5555
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
        - .env
    restart: unless-stopped
    networks:
      - backend
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend

networks:
  frontend:
  backend:
    internal: true
