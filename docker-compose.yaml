services:
  app:
    build: .
    image: demo-app:1.0
    container_name: demo
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
        - .env
    restart: unless-stopped
