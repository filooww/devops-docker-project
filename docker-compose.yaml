x-app-common: &app-common
  build: .
  image: demo-app:1.0
  expose:
    - 5555
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health')"]
    interval: 30s
    timeout: 5s
    retries: 3
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cpus: 0.5
  mem_limit: 256m
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  networks:
    backend:
      aliases: [app]

x-ngin-common: &nginx-common
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cpus: 0.25
  mem_limit: 64m
  restart: unless-stopped
  networks:
    - backend
    - frontend


services:
  app-dev:
    <<: *app-common
    container_name: demo-dev
    profiles: [dev]
    env_file: [.env.dev]

  app-prod:
    <<: *app-common
    container_name: demo-prod
    profiles: [prod]
    env_file: [.env.prod]


  nginx-dev:
    <<: *nginx-common
    build:
      context: ./nginx
      target: dev
    image: nginx-custom:dev
    container_name: nginx-dev
    profiles: [dev]
    ports:
      - "80:80"
    depends_on:
      app-dev:
        condition: service_healthy


  nginx-prod:
    <<: *nginx-common
    build:
      context: ./nginx
      target: prod
    image: nginx-custom:prod
    container_name: nginx-prod
    profiles: [prod]
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      app-prod:
        condition: service_healthy


networks:
  frontend:
  backend:
    internal: true
